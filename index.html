<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Unlocking File</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body style="background:#0f172a;color:white;display:flex;justify-content:center;align-items:center;height:100vh">

<div style="background:#111827;padding:25px;border-radius:12px;text-align:center;width:300px">
  <h3>🔐 Unlocking Your File</h3>
  <p>Please stay on this page</p>

  <h1 id="timer">15</h1>

  <button id="btn"
    style="display:none;padding:12px;background:#22c55e;border:none;border-radius:8px;font-weight:bold"
    onclick="unlock()">
    ⚡ MOVIE IS READY
  </button>
</div>

<script>
/* ================= PARAMS ================= */
const params = new URLSearchParams(window.location.search);
const uid = params.get('uid');
const fid = params.get('fid');

/* ================= ELEMENTS ================= */
const timer = document.getElementById('timer');
const btn = document.getElementById('btn');

/* ================= STATE ================= */
let timeLeft = 15;
let timerStarted = false;
let adOpened = false;

/* ================= AD FIRST ================= */
// First user click → ad opens → THEN timer starts
document.addEventListener('click', () => {
  if (adOpened) return;

  adOpened = true;

  window.open(
    'https://otieu.com/4/10372652', // 🔥 Monetag Direct Link
    '_blank'
  );

  startTimer(); // ⏳ timer AFTER ad
});

/* ================= TIMER ================= */
function startTimer() {
  if (timerStarted) return;
  timerStarted = true;

  const interval = setInterval(() => {
    timer.innerText = timeLeft;
    timeLeft--;

    if (timeLeft < 0) {
      clearInterval(interval);
      timer.innerText = 'READY';
      btn.style.display = 'block';
    }
  }, 1000);
}

/* ================= UNLOCK ================= */
function unlock() {
  fetch('/unlock/send', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ uid, fid })
  })
  .then(r => r.json())
  .then(d => {
    if (d.redirect) {
      window.location.href = d.redirect;
    } else {
      document.body.innerHTML =
        '<h2 style="color:red">❌ Failed</h2>';
    }
  })
  .catch(() => {
    document.body.innerHTML =
      '<h2 style="color:red">❌ Server error</h2>';
  });
}
</script>

</body>
</html>
