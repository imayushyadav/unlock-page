<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Unlocking File</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="background:#0f172a;color:white;display:flex;justify-content:center;align-items:center;height:100vh">

<div style="background:#111827;padding:25px;border-radius:12px;text-align:center;width:300px">
  <h3>🔐 Unlocking Your File</h3>
  <p>Please stay on this page</p>

  <h1 id="timer">15</h1>

  <button id="btn" style="display:none;padding:12px;background:#22c55e;border:none;border-radius:8px;font-weight:bold"
    onclick="unlock()">⚡ FILE IS READY</button>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const uid = params.get('uid');
const fid = params.get('fid');

let t = 15;
const timer = document.getElementById('timer');
const btn = document.getElementById('btn');

const i = setInterval(() => {
  t--;
  timer.innerText = t;
  if (t <= 0) {
    clearInterval(i);
    timer.innerText = 'READY';
    btn.style.display = 'block';
  }
}, 1000);

function unlock() {
  fetch('/unlock/send', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ uid, fid })
  })
  .then(r => r.json())
  .then(d => {
    if (d.redirect) {
      window.location.href = d.redirect;
    } else {
      document.body.innerHTML =
        '<h2 style="color:red">❌ Failed</h2>';
    }
  })
  .catch(() => {
    document.body.innerHTML =
      '<h2 style="color:red">❌ Server error</h2>';
  });
}

</script>
