<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Unlocking File</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body style="background:#0f172a;color:white;display:flex;justify-content:center;align-items:center;height:100vh">

<div style="background:#111827;padding:25px;border-radius:12px;text-align:center;width:300px">
  <h3>🔐 Unlocking Your File</h3>
  <p id="info">Click below to continue</p>

  <!-- Action button (ONLY for Watch Video) -->
  <button id="adBtn"
    style="padding:12px;background:#3b82f6;border:none;border-radius:8px;font-weight:bold;color:white">
    ▶ CONTINUE TO WATCH AD
  </button>

  <!-- Timer -->
  <p id="timer" style="margin-top:15px;display:none">Please wait…</p>

  <!-- Final button -->
  <button id="readyBtn"
    style="display:none;margin-top:15px;padding:12px;background:#22c55e;border:none;border-radius:8px;font-weight:bold"
    onclick="unlock()">
    ⚡ FILE IS READY
  </button>
</div>

<script>
/* ===== PARAMS ===== */
const params = new URLSearchParams(window.location.search);
const uid = params.get('uid');
const fid = params.get('fid');
const from = params.get('from'); // shortlink or null

/* ===== ELEMENTS ===== */
const adBtn = document.getElementById('adBtn');
const readyBtn = document.getElementById('readyBtn');
const timerEl = document.getElementById('timer');
const info = document.getElementById('info');

/* ===== CONFIG ===== */
let timerSeconds = 5;
let popupOpened = false;

/* ===== SHORTLINK FLOW ===== */
if (from === 'shortlink') {
  // No popup here
  adBtn.style.display = 'none';
  info.innerText = 'Please wait…';
  timerEl.style.display = 'block';
  startTimer();
}

/* ===== WATCH VIDEO FLOW ===== */
adBtn.onclick = () => {
  if (popupOpened) return;
  popupOpened = true;

  // Monetag popup (SAFE: user click)
  window.open(
    'https://otieu.com/4/10372652',
    '_blank'
  );

  adBtn.style.display = 'none';
  timerEl.style.display = 'block';
  startTimer();
};

/* ===== TIMER ===== */
function startTimer() {
  let t = timerSeconds;
  timerEl.innerText = `Please wait ${t}s`;

  const interval = setInterval(() => {
    t--;
    timerEl.innerText = `Please wait ${t}s`;

    if (t <= 0) {
      clearInterval(interval);
      timerEl.style.display = 'none';
      readyBtn.style.display = 'block';
    }
  }, 1000);
}

/* ===== UNLOCK ===== */
function unlock() {
  fetch('/unlock/send', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ uid, fid })
  })
  .then(r => r.json())
  .then(d => {
    if (d.redirect) {
      window.location.href = d.redirect;
    } else {
      document.body.innerHTML = '<h2 style="color:red">❌ Failed</h2>';
    }
  });
}
</script>

</body>
</html>
